<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4CAST | Wardrobe Circularity</title>

    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/circularity.css">
</head>
<body>
    <header class="brand-heading">
        <h1>4CAST</h1>
    </header>
    <main class="page circularity-page">
        <h2 class="circularity-title">WEAR MORE. WASTE LESS.</h2>
        <section class="wardrobe-summary">
            <h3>Your Wardrobe</h3>
            <p class="piece-count">
                <span>{{ pieces }}</span> PIECES
            </p>
            <div class="summary-stats">
                <div>
                    <p>Worn this week</p>
                    <span>{{ worn_count }}</span>
                </div>
                <div>
                    <p>Ready to Rewear</p>
                    <span>{{ available_count }}</span>
                </div>
            </div>
        </section>
        <section class="dashboard">
            <h2>Circularity Dashboard</h2>
            <div class="dashboard-box">
                <div class="dashboard-row">
                    Rewear tracker
                </div>
                <div class="dashboard-row">
                    Repair &amp; care
                </div>
                <div class="dashboard-row">
                    Rehome &amp; recirculate
                </div>
            </div>
        </section>
    </main>
    <footer class="navbar">
        <a class="logo" href="{{ url_for('home') }}" aria-label="4CAST home">
            4CAST
        </a>
        <nav aria-label="Main navigation">
            <a href="{{ url_for('home') }}">home</a>
            <a href="{{ url_for('show_wardrobe')}}">wardrobe</a>
            <a
                class="add-button"
                href="{{ url_for('add') }}"
                aria-label="Add a garment"
            >
                +
            </a>
            <a href="#outfits">outfits</a>
            <a
                class="active"
                href="{{ url_for('circularity') }}"
                aria-current="page"
            >
                circularity
            </a>
        </nav>
    </footer>
</body>
</html>
