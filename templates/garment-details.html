<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4CAST | Garment Details</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/garment-details.css">

</head>
<body>
    <main class="page garment-details-page">
        <div class="garment-image">
            <img src="../images/sweater-placeholder.jpg" alt="Gray sweater">
        </div>
        <div class="garment-tabs">
            <span>Information</span>
            <span>Outfit</span>
        </div>
        <section class="garment-info">
            <h2>Occasion Info</h2>
            <div class="info-row">Season</div>
            <div class="info-row">Occasion</div>
            <h2>Item Info</h2>
            <div class="info-row">Category</div>
            <div class="info-row">Color</div>
            <div class="info-row">Material</div>
        </section>
    </main>
    <footer class="navbar">
        <a
            class="logo"
            href="index.html"
            aria-label="4CAST home"
        >
            4CAST
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html">
                home
            </a>
            <a
                class="active"
                href="wardrobe.html"
                aria-current="page"
            >
            wardrobe
            </a>
            <a
                class="add-button"
                href="add-garment.html"
                aria-label="Add a garment"
            >
                +
            </a>
            <a href="#outfits">
                outfits
            </a>
            <a href="#circularity">
                circularity
            </a>

        </nav>
    </footer>

</html>
