<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4CAST | Wardrobe</title>

    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/wardrobe.css">

</head>
<body>
    <header class="brand-heading wardrobe-heading">
        <h1>4CAST</h1>
        <span>WARDROBE</span>
    </header>
    <main class="page wardrobe-page">
        <form class="wardrobe-search" id="wardrobe-search-form">
            <select id="search-field" aria-label="Search by">
                <option value="name">Name</option>
                <option value="brand">Brand</option>
                <option value="color">Color</option>
                <option value="warmth">Warmth Level</option>
            </select>

            <input type="search" id="wardrobe-search-input" placeholder="search your wardrobe..." aria-label="Search wardrobe">
        </form>
        <!--
        <form class="wardrobe-search">
            <input 
                type="search"
                name="search"
                placeholder="Search"
                aria-label="Search wardrobe"
                >
        </form>
        -->
        
        <section class="wardrobe-grid" aria-label="Your wardrobe">
            {% if items %}
                {% for item in items%}
                    <article class="clothing-card"
                                    data-name="{{ (item.name or '')|lower }}"
                                    data-brand="{{ (item.brand or '')|lower }}"
                                    data-color="{{ (item.color or '')|lower }}"
                                    data-warmth="{{ item.warmth_level if item.warmth_level is not none else '' }}">
                        <div class="clothing-image">
                            <img src="{{ item.image_url }}" alt="{{ item.name or 'Clothing' }}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>

                        <div style="padding: 10px;">
                            <h3 style="margin: 0; font-size: 14px;">
                                {{ item.name or 'Unnamed Item' }}
                            </h3>

                            <p style="margin: 0; color: #777; font-size: 11px;">
                                {{ item.color }}
                            </p>

                            <form action="{{ url_for('delete', item_id=item['_id'])}}" method="POST" onsubmit="return confirm('are you sure you want to delete this item?');">
                                <button type="submit" class="delete-button">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </article>
                {% endfor %}
            {% else %}
                <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                    <p>Your wardrobe is empty</p>
                    <a href="{{ url_for('add') }}" style="color: #4A3C51; text-decoration: underline;">Add a garment</a>
                </div>
            {% endif %} 
            <p id="no-search-results" hidden>No matching items found</p>

        </section>

        <div class="wardrobe-filters" aria-label="Filter wardrobe">
            <button type="button">Sweaters</button>
            <button type="button">Flats</button>
            <button type="button">Jeans</button>
            <button type="button">Dress</button>
        </div>
        <div class="browse-wardrobe">
            Browse your wardrobe...
        </div>
    </main>
    <footer class="navbar">
        <a
            class="logo"
            href="index.html"
            aria-label="4CAST home"
        >
            4CAST
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html">
                home
            </a>
            <a
                class="active"
                href="wardrobe.html"
                aria-current="page"
            >
            wardrobe
            </a>
            <a
                class="add-button"
                href="{{ url_for('add') }}"
                aria-label="Add a garment"
            >
                +
            </a>
            <a href="#outfits">
                outfits
            </a>
            <a href="#circularity">
                circularity
            </a>

        </nav>
    </footer>

    <script>
        const searchForm = document.getElementById("wardrobe-search-form");
        const searchInput = document.getElementById("wardrobe-search-input");
        const searchField = document.getElementById("search-field");
        const clothingCards = document.querySelectorAll(".clothing-card");
        const noResults = document.getElementById("no-search-results");

        function searchWardrobe() {
            const query = searchInput.value.trim().toLowerCase();
            const field = searchField.value;
            let visibleCount=0;

            clothingCards.forEach(card=> 
                {const value = card.dataset[field] || ""; 
                const matches = value.includes(query);
                card.hidden = !matches;
                if(matches) {
                    visibleCount++;
                }});
                noResults.hidden = query === "" || visibleCount>0;
        }
        searchForm.addEventListener("submit", event=> {event.preventDefault(); searchWardrobe();});
        searchInput.addEventListener("input", searchWardrobe);
        searchField.addEventListener("change", searchWardrobe);
    </script>
</body>
</html>
