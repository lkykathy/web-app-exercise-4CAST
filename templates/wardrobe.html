<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4CAST | Wardrobe</title>

    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/wardrobe.css">

</head>
<body>
    <header class="brand-heading wardrobe-heading">
        <h1>4CAST</h1>
        <span>WARDROBE</span>
    </header>
    <main class="page wardrobe-page">
        <form class="wardrobe-search">
            <input 
                type="search"
                name="search"
                placeholder="Search"
                aria-label="Search wardrobe"
                >
        </form>
        <section class="wardrobe-grid" aria-label="Your wardrobe">
            
            <article class="clothing-card">
                <div class="clothing-image">
                    <span>CLOTHING</span>
                </div>
            </article>

            <article class="clothing-card">
                <div class="clothing-image">
                    <span>CLOTHING</span>
                </div>
            </article>

            <article class="clothing-card">
                <div class="clothing-image">
                    <span>CLOTHING</span>
                </div>
            </article>

            <article class="clothing-card">
                <div class="clothing-image">
                    <span>CLOTHING</span>
                </div>
            </article>

            <article class="clothing-card">
                <div class="clothing-image">
                    <span>CLOTHING</span>
                </div>
            </article>

            <article class="clothing-card">
                <div class="clothing-image">
                    <span>CLOTHING</span>
                </div>
            </article>
        </section>

        <div class="wardrobe-filters" aria-label="Filter wardrobe">
            <button type="button">Sweaters</button>
            <button type="button">Flats</button>
            <button type="button">Jeans</button>
            <button type="button">Dress</button>
        </div>
        <div class="browse-wardrobe">
            Browse your wardrobe...
        </div>
    </main>
    <footer class="navbar">
        <a
            class="logo"
            href="index.html"
            aria-label="4CAST home"
        >
            4CAST
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html">
                home
            </a>
            <a
                class="active"
                href="wardrobe.html"
                aria-current="page"
            >
            wardrobe
            </a>
            <a
                class="add-button"
                href="#add-garment"
                aria-label="Add a garment"
            >
                +
            </a>
            <a href="#outfits">
                outfits
            </a>
            <a href="#circularity">
                circularity
            </a>

        </nav>
    </footer>
</body>
</html>
